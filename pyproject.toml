[project]
name = "skypro-python-e-commerce"
version = "0.1.0"
description = ""
authors = [
    {name = "Uriy-T",email = "briner_asterios@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"


[tool.poetry.group.lint.dependencies]
black = "^26.5.1"
flake8 = "^7.3.0"
isort = "^8.0.1"
mypy = "^2.2.0"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 79
